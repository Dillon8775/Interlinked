# Every field here must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
mod_id=interlinked
mod_version=1.0
mod_name=Interlinked
description=A Fabric/(Neo)Forge mod that interlinks players with different modes and settings.
mod_author=Dillon8775
credits=Dillon8775, MannyQUESO
license=All rights reserved unless explicitly stated.
logo=assets/interlinked/icon
mc_version=mc26.3
supported_mc_versions=26.3
# Use "-alpha.# for snapshots, "-pre.#" for pre-releases, "-rc.#" for release candidates
minecraft_version_range=>=26.3-rc.2 <26.4
group=net.dillon.interlinked

# Links
homepage=https://modrinth.com/mod/interlinked
sources=https://github.com/Dillon8775/Interlinked
issues=https://github.com/Dillon8775/Interlinked/issues
discord=https://discord.gg/vfqEAn4YFy

# Common
java_version=25
minecraft_version=26.3-rc-2
devauth_enabled=1

# This is the version of Minecraft that the 'common' directory uses
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-rc-2-1

# Dependencies
## Balm
### https://maven.twelveiterations.com/service/rest/repository/browse/maven-public/net/blay09/mods/balm-common/
