## DillonLib
### https://modrinth.com/mod/dillon-lib/versions
dillonlib_version=1.1
## Mod Menu
### https://modrinth.com/mod/modmenu/versions
modmenu_version=21.0.0-alpha.1
## YetAnotherConfigLib (YACL)
### https://maven.isxander.dev/web/releases/dev/isxander/yet-another-config-lib/
yacl_version=3.9.6+26.3
## DevAuth
### https://modrinth.com/mod/dev-auth-neo/versions
devauth_neo_version=1.1.1

# Fabric
## https://fabricmc.net/develop/
fabric_version=0.160.4+26.3
